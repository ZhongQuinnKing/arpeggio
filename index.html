<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"/>
<title>赛博粒子圣诞树 · 互动版</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #02040c; }
  #app { position: fixed; inset: 0; touch-action: none; }
  #app canvas { display: block; }
  .title {
    position: fixed; left: 50%; top: 6%; transform: translateX(-50%);
    font: 300 32px/1.5 Georgia, "Times New Roman", "Songti SC", serif;
    letter-spacing: .3em; text-indent: .3em;
    background: linear-gradient(180deg, #fff8dc 0%, #f0d78a 45%, #c9a227 100%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 16px rgba(235, 200, 110, .5));
    user-select: none; pointer-events: none; white-space: nowrap; z-index: 5;
  }
  .hint {
    position: fixed; left: 50%; bottom: 10px; transform: translateX(-50%);
    font: 12px/1.8 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    letter-spacing: .18em; color: rgba(140, 200, 235, .5);
    user-select: none; pointer-events: none; white-space: nowrap; text-align: center;
  }
  .ghost-btn {
    position: fixed; left: 50%; bottom: 42px; transform: translateX(-50%);
    font: 13px/1.6 -apple-system, "PingFang SC", sans-serif;
    letter-spacing: .2em; color: rgba(190, 240, 255, .95);
    background: rgba(20, 60, 90, .35);
    border: 1px solid rgba(80, 220, 255, .45);
    border-radius: 999px; padding: 10px 26px;
    cursor: pointer; outline: none;
    box-shadow: 0 0 22px rgba(60, 200, 255, .25), inset 0 0 18px rgba(60, 200, 255, .12);
    transition: all .25s;
    z-index: 10;
  }
  .ghost-btn:hover { background: rgba(30, 90, 130, .5); box-shadow: 0 0 30px rgba(60, 200, 255, .45); }
  .ghost-btn:disabled { opacity: .55; cursor: default; }
  .cam {
    position: fixed; right: 18px; bottom: 18px; width: 224px; height: 168px;
    border-radius: 12px; overflow: hidden;
    border: 1px solid rgba(80, 220, 255, .35);
    box-shadow: 0 0 26px rgba(60, 200, 255, .28);
    display: none; background: #000;
    z-index: 9;
  }
  .cam video { position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; transform: scaleX(-1); opacity: 0; }   /* 不显示原画面（保护隐私，只显示手） */
  .cam canvas { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 2; }
  .err {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
    font: 14px/2 -apple-system, "PingFang SC", sans-serif;
    color: #ff9f9f; text-align: center; max-width: 80%;
  }
  .filewarn {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
    font: 14px/2.1 -apple-system, "PingFang SC", sans-serif;
    color: rgba(255, 220, 140, .95); text-align: center;
    background: rgba(30, 25, 8, .85); border: 1px solid rgba(255, 200, 90, .4);
    border-radius: 12px; padding: 22px 34px; z-index: 99; max-width: 76%;
  }
  .filewarn b { color: #ffe08a; }
  .flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 20; }
  .loader {
    position: fixed; inset: 0; z-index: 100;
    background: #02040c;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    transition: opacity 1.1s;
  }
  .loader-title {
    font: 300 30px/1.5 Georgia, "Times New Roman", "Songti SC", serif;
    letter-spacing: .3em; text-indent: .3em;
    background: linear-gradient(180deg, #fff8dc 0%, #f0d78a 45%, #c9a227 100%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 18px rgba(235, 200, 110, .55));
    margin-bottom: 46px;
  }
  .loader-bar {
    width: min(300px, 62vw); height: 2px;
    background: rgba(201, 162, 39, .18);
    border-radius: 2px; overflow: hidden;
  }
  .loader-fill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, #c9a227, #f7dc86, #fff8dc);
    box-shadow: 0 0 14px rgba(247, 220, 134, .85);
    border-radius: 2px;
    transition: width .3s ease;
  }
  .loader-pct {
    margin-top: 18px;
    font: 400 12px/1.5 Georgia, serif;
    letter-spacing: .3em; text-indent: .3em;
    color: rgba(240, 215, 138, .75);
  }
  .loader-tip {
    position: absolute; bottom: 9%;
    font: 12px/1.8 -apple-system, "PingFang SC", sans-serif;
    letter-spacing: .18em;
    color: rgba(140, 190, 235, .4);
  }
  @media (max-width: 700px) {
    .loader-title { font-size: 20px; letter-spacing: .2em; margin-bottom: 36px; }
  }
  .loader { overflow: hidden; }
  .loader::before {
    content: ''; position: absolute; left: 50%; top: 42%;
    width: 74vmin; height: 74vmin; transform: translate(-50%, -50%);
    background: radial-gradient(circle, rgba(201,162,39,.15) 0%, rgba(201,162,39,.05) 45%, transparent 72%);
    animation: lgBreathe 5.5s ease-in-out infinite; pointer-events: none;
  }
  @keyframes lgBreathe {
    0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: .75; }
    50% { transform: translate(-50%, -50%) scale(1.15); opacity: 1; }
  }
  .loader-staff {
    position: absolute; left: 4%; right: 4%; top: 50%;
    height: 120px; transform: translateY(-50%);
    display: flex; flex-direction: column; justify-content: space-between;
    opacity: .5; pointer-events: none;
  }
  .loader-staff span {
    display: block; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(201,162,39,.25) 18%, rgba(201,162,39,.25) 82%, transparent);
  }
  .loader-notes { position: absolute; inset: 0; pointer-events: none; }
  .loader-notes span {
    position: absolute; bottom: -44px;
    font: 300 26px Georgia, "Times New Roman", serif;
    color: rgba(240, 215, 138, .55);
    text-shadow: 0 0 16px rgba(240, 205, 120, .55);
    animation: noteFloat 9s linear infinite;
    animation-delay: var(--d, 0s);
  }
  @keyframes noteFloat {
    0% { transform: translateY(0) translateX(0); opacity: 0; }
    12% { opacity: .8; }
    65% { opacity: .5; }
    100% { transform: translateY(-92vh) translateX(var(--x, 14px)); opacity: 0; }
  }
  .loader-inner { position: relative; display: flex; flex-direction: column; align-items: center; z-index: 2; }
  .loader-bar { position: relative; overflow: visible; }
  .loader-fill { position: relative; overflow: hidden; }
  .loader-fill::after {
    content: ''; position: absolute; top: 0; bottom: 0; width: 46px;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .95), transparent);
    animation: lgSheen 1.5s linear infinite;
  }
  @keyframes lgSheen { 0% { left: -46px; } 100% { left: 100%; } }
  .loader-dot {
    position: absolute; top: 50%; left: 0%;
    width: 9px; height: 9px; margin: -4.5px 0 0 -4.5px;
    border-radius: 50%; background: #fff8dc;
    box-shadow: 0 0 10px 2px rgba(247, 220, 134, .95), 0 0 26px 7px rgba(247, 220, 134, .4);
    animation: lgDotPulse 1.4s ease-in-out infinite;
    transition: left .3s ease;
  }
  @keyframes lgDotPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.4); } }
  .loader-wave { display: flex; align-items: flex-end; gap: 5px; height: 26px; margin-top: 24px; }
  .loader-wave span {
    width: 3px; height: 6px; border-radius: 2px;
    background: linear-gradient(180deg, #f7dc86, #c9a227);
    box-shadow: 0 0 8px rgba(247, 220, 134, .5);
    animation: lgWave 1.15s ease-in-out infinite;
  }
  @keyframes lgWave { 0%, 100% { height: 6px; opacity: .4; } 50% { height: 26px; opacity: 1; } }
  @media (max-width: 700px) {
    .title { font-size: 20px; letter-spacing: .2em; top: 4%; }
    .hint { font-size: 10px; letter-spacing: .1em; white-space: normal; max-width: 92%; line-height: 1.7; }
    .ghost-btn { font-size: 12px; padding: 9px 20px; bottom: 52px; }
    .cam { width: 132px; height: 99px; right: 10px; bottom: 10px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div class="loader" id="loader">
  <div class="loader-staff"><span></span><span></span><span></span><span></span><span></span></div>
  <div class="loader-notes">
    <span style="left:12%; --d:0s; --x:22px">♪</span>
    <span style="left:30%; --d:2.6s; --x:-18px">♫</span>
    <span style="left:64%; --d:1.3s; --x:26px">♪</span>
    <span style="left:83%; --d:4.1s; --x:-22px">♬</span>
  </div>
  <div class="loader-inner">
    <div class="loader-title">MERRY CHRISTMAS</div>
    <div class="loader-bar">
      <div class="loader-fill" id="loadFill"></div>
      <div class="loader-dot" id="loadDot"></div>
    </div>
    <div class="loader-wave"><span style="animation-delay:0.00s"></span><span style="animation-delay:0.08s"></span><span style="animation-delay:0.16s"></span><span style="animation-delay:0.24s"></span><span style="animation-delay:0.32s"></span><span style="animation-delay:0.40s"></span><span style="animation-delay:0.48s"></span><span style="animation-delay:0.56s"></span><span style="animation-delay:0.64s"></span><span style="animation-delay:0.72s"></span><span style="animation-delay:0.80s"></span><span style="animation-delay:0.88s"></span><span style="animation-delay:0.96s"></span><span style="animation-delay:1.04s"></span></div>
    <div class="loader-pct" id="loadPct">0%</div>
  </div>
  <div class="loader-tip">正在准备您的圣诞树…（首次加载稍等，之后打开秒进）</div>
</div>
<div class="title">MERRY CHRISTMAS</div>
<div class="hint" id="hint">拖动旋转　滚轮缩放　点击爆发</div>
<button class="ghost-btn" id="gestureBtn">开启手势控制</button>

<div class="cam" id="camBox">
  <video id="camVideo" playsinline muted autoplay></video>
  <canvas id="camOverlay" width="224" height="168"></canvas>
</div>

<script src="vendor/three.min.js"></script>
<script src="vendor/shaders/CopyShader.js"></script>
<script src="vendor/shaders/LuminosityHighPassShader.js"></script>
<script src="vendor/postprocessing/EffectComposer.js"></script>
<script src="vendor/postprocessing/RenderPass.js"></script>
<script src="vendor/postprocessing/ShaderPass.js"></script>
<script src="vendor/postprocessing/UnrealBloomPass.js"></script>
<script>
(function () {
  'use strict';

  // 手势控制共享对象（由手势模块更新，主循环读取）
  window.__gestureCtl = { active: false, explode: 0, rotSpeed: 0, camY: null, zoom: null, photoSpin: 0 };

  // ---------- 加载进度 ----------
  var loaderEl = document.getElementById('loader');
  var loadFill = document.getElementById('loadFill');
  var loadPct = document.getElementById('loadPct');
  var loadDot = document.getElementById('loadDot');
  var _progress = 0;
  function setLoad(p) {
    if (p > _progress) {
      _progress = p;
      loadFill.style.width = _progress + '%';
      if (loadDot) loadDot.style.left = _progress + '%';
      loadPct.textContent = Math.round(_progress) + '%';
    }
  }
  function finishLoad() {
    setLoad(100);
    setTimeout(function () {
      loaderEl.style.opacity = '0';
      setTimeout(function () { loaderEl.style.display = 'none'; }, 1150);
    }, 350);
  }
  setLoad(5);

  // 预取大文件进缓存（让"开启手势"秒级就绪），带真实进度
  function prefetchWithProgress(url, onP) {
    return fetch(url).then(function (res) {
      var total = parseInt(res.headers.get('Content-Length') || '0', 10);
      if (!res.body || !total) {
        return res.arrayBuffer().then(function () { onP(1); });
      }
      var reader = res.body.getReader();
      var loaded = 0;
      return (function pump() {
        return reader.read().then(function (r) {
          if (r.done) { onP(1); return; }
          loaded += r.value.length;
          onP(Math.min(1, loaded / total));
          return pump();
        });
      })();
    });
  }
  // 资源路径（默认本地；线上探测 CDN 成功后切换到 CDN——jsdelivr 国内更快）
  window.__assetPaths = { model: './models/hand_landmarker.task', wasmDir: './vendor/wasm' };
  function startPrefetch() {
    var isLocal = location.hostname === 'localhost' || location.hostname === '127.0.0.1' || location.protocol === 'file:';
    var CDN = 'https://cdn.jsdelivr.net/gh/ZhongQuinnKing/arpeggio@main';
    var tasks = [];
    // 模型（7.8MB）
    if (isLocal) {
      tasks.push(prefetchWithProgress('./models/hand_landmarker.task', function (p) { setLoad(30 + p * 30); }));
    } else {
      tasks.push(
        prefetchWithProgress(CDN + '/models/hand_landmarker.task', function (p) { setLoad(30 + p * 30); })
          .then(function () { window.__assetPaths.model = CDN + '/models/hand_landmarker.task'; })
          .catch(function () { return prefetchWithProgress('./models/hand_landmarker.task', function (p) { setLoad(30 + p * 30); }); })
      );
    }
    // wasm（9.4MB）—— 与模型并行下载
    if (isLocal) {
      tasks.push(prefetchWithProgress('./vendor/wasm/vision_wasm_internal.wasm', function (p) { setLoad(60 + p * 35); }));
    } else {
      tasks.push(
        prefetchWithProgress(CDN + '/vendor/wasm/vision_wasm_internal.wasm', function (p) { setLoad(60 + p * 35); })
          .then(function () { window.__assetPaths.wasmDir = CDN + '/vendor/wasm'; })
          .catch(function () { return prefetchWithProgress('./vendor/wasm/vision_wasm_internal.wasm', function (p) { setLoad(60 + p * 35); }); })
      );
    }
    Promise.all(tasks).then(function () { finishLoad(); });
  }

  function fail(msg) {
    var d = document.createElement('div');
    d.className = 'err';
    d.textContent = msg;
    document.body.appendChild(d);
  }

  // file:// 协议下无法使用模块/摄像头，给出引导
  if (location.protocol === 'file:') {
    var fw = document.createElement('div');
    fw.className = 'filewarn';
    fw.innerHTML = '<b>手势功能需要本地服务器</b><br/>请回到文件夹，双击「启动.command」<br/>（会自动打开浏览器，摄像头需在弹窗中允许）';
    document.body.appendChild(fw);
  }

  function main() {
    var TREE_H = 21, TREE_R = 8.6, CENTER_Y = 10.5;
    // 移动端检测：自动降档保证手机流畅
    var IS_MOBILE = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) || window.innerWidth < 900;

    // ---------- 渲染基础 ----------
    var renderer;
    try {
      renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    } catch (e) { fail('当前浏览器不支持 WebGL'); return; }
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, IS_MOBILE ? 1.5 : 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x02040c, 1);
    document.getElementById('app').appendChild(renderer.domElement);

    var scene = new THREE.Scene();
    var camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 420);
    var treeGroup = new THREE.Group();
    scene.add(treeGroup);

    // ---------- 共享 uniforms ----------
    var uniforms = {
      uTime:        { value: 0 },
      uMouse:       { value: new THREE.Vector3(9999, 0, 0) },
      uMouseActive: { value: 0 },
      uExplode:     { value: 0 },
      uPR:          { value: renderer.getPixelRatio() }
    };

    // ---------- 粒子数据 ----------
    var pos = [], col = [], siz = [], sed = [], act = [];

    function push(x, y, z, c, s, interact) {
      pos.push(x, y, z);
      col.push(c.r, c.g, c.b);
      siz.push(s);
      sed.push(Math.random());
      act.push(interact);
    }

    function colorTree(t, r) {
      // 原片配色：金绿渐变（底青绿 → 顶香槟金）+ 金白高光点缀
      var h, s, l;
      if (r < 0.12) {                  // 亮金高光
        h = 0.125 + (Math.random() - 0.5) * 0.02;
        s = 0.9; l = 0.6 + Math.random() * 0.12;
      } else if (r < 0.14) {           // 奶油白（少量）
        h = 0.12; s = 0.15; l = 0.72;
      } else if (r < 0.22) {           // 红色装饰（原片约 7%）
        h = 0.99; s = 0.85; l = 0.5;
      } else {                         // 主体：均匀金黄色（原片中位 46°）
        h = 0.115 + (Math.random() - 0.5) * 0.045;
        s = 0.75;
        l = 0.34 + Math.random() * 0.2;
      }
      return new THREE.Color().setHSL(h % 1, s, Math.max(0.25, Math.min(0.92, l)));
    }

    var i, a, t, rr, c;

    // 1) 层叠圆锥主体（5 层枝叶结构，层底缘密集形成层次边缘）
    var LAYERS = 5;
    for (var L = 0; L < LAYERS; L++) {
      var yBot = (L / LAYERS) * TREE_H;
      var yTop = Math.min(((L + 1) / LAYERS) * TREE_H + 1.35, TREE_H + 0.2);
      var rBot = TREE_R * (1 - L / LAYERS);
      var rTop = TREE_R * (1 - Math.min((L + 1) / LAYERS, 1)) * 0.6;
      var perLayer = IS_MOBILE ? 2100 : 4800;
      for (i = 0; i < perLayer; i++) {
        var u = Math.random();
        var tt = Math.pow(u, 1.35);            // 偏层底（层缘密、层内疏）
        var yy = yTop - (yTop - yBot) * tt;
        var rrp = rTop + (rBot - rTop) * tt;
        var isEdge = tt < 0.14;                // 层底缘
        rrp *= 1 + (Math.random() - 0.5) * (isEdge ? 0.05 : 0.11);
        a = Math.random() * Math.PI * 2;
        t = Math.max(0, Math.min(1, yy / TREE_H));
        c = colorTree(t, Math.random());
        if (isEdge) c.offsetHSL(0, 0.06, 0.1); // 层缘更亮
        var x0 = Math.cos(a) * rrp, z0 = Math.sin(a) * rrp;
        var y0 = yy + (isEdge ? (Math.random() - 0.5) * 0.12 : (Math.random() - 0.5) * 0.3);
        push(x0, y0, z0, c, isEdge ? 1.15 + Math.random() * 0.7 : 0.9 + Math.random() * 0.9, 1.0);
        if (Math.random() < 0.28) {   // 水面倒影（蓝紫色调）
          var rc = new THREE.Color().setHSL(0.70 + Math.random() * 0.07, 0.55, 0.3 + Math.random() * 0.2);
          push(x0 * (0.92 + Math.random() * 0.16), -y0 * 0.42, z0 * (0.92 + Math.random() * 0.16),
               rc, 0.7 + Math.random() * 0.7, 0.35);
        }
      }
    }

    // 3) 装饰灯珠
    for (i = 0; i < 300; i++) {
      t = Math.pow(Math.random(), 0.8);
      a = Math.random() * Math.PI * 2;
      rr = TREE_R * (1 - t) * 1.01;
      var r0 = Math.random();
      if (r0 < 0.55) c = new THREE.Color().setHSL(0.115, 0.95, 0.62);      // 香槟金
      else if (r0 < 0.75) c = new THREE.Color().setHSL(0.12, 0.15, 0.95);  // 奶油白
      else if (r0 < 0.88) c = new THREE.Color().setHSL(0.5, 0.9, 0.7);     // 青
      else c = new THREE.Color().setHSL(0.99, 0.9, 0.6);                   // 红
      push(Math.cos(a) * rr, t * TREE_H, Math.sin(a) * rr, c, 2.0 + Math.random() * 1.2, 1.0);
    }

    // 4) 地面光晕（蓝紫水面 + 青绿）
    for (i = 0; i < 2200; i++) {
      rr = 14 * Math.pow(Math.random(), 1.6);
      a = Math.random() * Math.PI * 2;
      var r1 = Math.random();
      if (r1 < 0.68) c = new THREE.Color().setHSL(0.68 + Math.random() * 0.09, 0.6, 0.55 * (1 - (rr / 14) * 0.65));
      else if (r1 < 0.9) c = new THREE.Color().setHSL(0.5 + Math.random() * 0.06, 0.8, 0.55 * (1 - (rr / 14) * 0.65));
      else if (r1 < 0.97) c = new THREE.Color().setHSL(0.115, 0.9, 0.62);
      else c = new THREE.Color().setHSL(0.12, 0.1, 0.9);
      push(Math.cos(a) * rr, 0.02 + Math.random() * 0.1, Math.sin(a) * rr,
           c, 0.8 + Math.random() * 1.1, 0.55);
    }

    // ---------- 粒子着色器 ----------
    var VERT = [
      'attribute vec3 aColor;',
      'attribute float aSize;',
      'attribute float aSeed;',
      'attribute float aInteract;',
      'uniform float uTime;',
      'uniform vec3 uMouse;',
      'uniform float uMouseActive;',
      'uniform float uExplode;',
      'uniform float uPR;',
      'varying vec3 vColor;',
      'varying float vGlow;',
      'void main() {',
      '  vec3 pos = position;',
      '  float s2 = aSeed * 6.2831853;',
      '  pos.x += sin(uTime * 1.4 + s2) * 0.22;',
      '  pos.y += sin(uTime * 1.1 + s2 * 1.7) * 0.18;',
      '  pos.z += cos(uTime * 1.3 + s2 * 1.3) * 0.22;',
      '  vec3 dm = pos - uMouse;',
      '  float dmd = length(dm);',
      '  float f = 1.0 - smoothstep(1.2, 7.0, dmd);',
      '  pos += normalize(dm + vec3(1e-4)) * (f * f * 5.5 * uMouseActive * aInteract);',
      '  vec3 radial = normalize(vec3(pos.x, (pos.y - 10.5) * 0.7, pos.z) + vec3(1e-4));',
      '  pos += radial * (uExplode * (3.0 + aSeed * 11.0));',
      '  pos.y += uExplode * aSeed * 5.0;',
      '  float flick = 0.72 + 0.28 * sin(uTime * (1.5 + aSeed * 2.5) + s2 * 9.0);',
      '  vec4 mv = modelViewMatrix * vec4(pos, 1.0);',

    var photoGeo = new THREE.PlaneGeometry(9.5, 11.1);
    var photoCur = 0.01, photoV = 0, photoTarget = 0;
    var photoTgt = new THREE.Vector3(), photoTreeC = new THREE.Vector3(0, 10.5, 0), photoCamDir = new THREE.Vector3();

    // ---------- 开场特效（点击"开启手势控制"时：炸开 → 高速旋转 → 回旋聚拢）----------
    var introT = -1;
    window.__introBurst = function () { introT = 0; };
    window.__cyberTreePhoto = function (canvasEl, on) {
      if (canvasEl) {
        var aspect = canvasEl.width / canvasEl.height;
        // 显示尺寸按"相机前 9 单位"处的视野计算（约 62% 视野）——电脑/手机/iPad 都完整显示
        var vH = 2 * 9 * Math.tan(27.5 * Math.PI / 180);
        var vW = vH * (window.innerWidth / window.innerHeight);
        var maxW = vW * 0.56, maxH = vH * 0.56;
        var pw2, ph2;
        if (maxW / aspect <= maxH) { pw2 = maxW; ph2 = maxW / aspect; }
        else { ph2 = maxH; pw2 = maxH * aspect; }
        if (photoMesh) {
          // 换新照片
          photoMesh.material.map.dispose();
          photoMesh.material.map = new THREE.CanvasTexture(canvasEl);
          photoMesh.material.needsUpdate = true;
          photoMesh.geometry.dispose();
          photoMesh.geometry = new THREE.PlaneGeometry(pw2, ph2);
        } else {
          var mat = new THREE.MeshBasicMaterial({
            map: new THREE.CanvasTexture(canvasEl), transparent: true, side: THREE.DoubleSide,
            depthTest: false, depthWrite: false
          });
          photoMesh = new THREE.Mesh(new THREE.PlaneGeometry(pw2, ph2), mat);
          photoMesh.renderOrder = 20;
          photoMesh.scale.setScalar(0.01);
          photoMesh.visible = false;
          scene.add(photoMesh);
        }
      }
      photoTarget = on ? 1 : 0;
    };

    var clock = new THREE.Clock();
    var time = 0;
    var frames = 0;
    var frameCnt = 0, fpsT = 0;
    var AUTO = 0.16;

    function animate() {
      requestAnimationFrame(animate);
      var dt = Math.min(clock.getDelta(), 0.05);
      time += dt;
      frames++;
      uniforms.uTime.value = time;

      // 手势控制（平滑接入）
      var g = window.__gestureCtl;
      var gOpen = (g && g.active) ? g.explode * 1.2 : 0;
      exSmooth += (gOpen - exSmooth) * (1 - Math.pow(0.004, dt));   // 严格跟手
      var gRot = (g && g.active) ? g.rotSpeed : 0;
      rotVelHand += (gRot - rotVelHand) * (1 - Math.pow(0.01, dt));
      var gSpin = (g && g.active) ? (g.photoSpin || 0) : 0;
      photoSpinS += (gSpin - photoSpinS) * (1 - Math.pow(0.01, dt));
      if (g && g.active && g.camY != null) camYT = g.camY;
      if (g && g.active && g.zoom != null) distT = 44 - g.zoom * 24;   // 手靠近/拉开 = 放大

      // 【开场特效】炸开 → 高速旋转 → 回旋聚拢（覆盖手势值，结束后手势无缝接管）
      if (introT >= 0) {
        introT += dt;
        if (introT < 0.45) {                 // 猛地炸开
          exSmooth = (introT / 0.45) * 1.5;
          rotVelHand = introT * 9;
        } else if (introT < 2.2) {           // 星云高速旋转
          exSmooth = 1.5;
          rotVelHand = 3.8;
        } else if (introT < 3.4) {           // 回旋聚拢（缓出）
          var ik = (introT - 2.2) / 1.2;
          exSmooth = 1.5 * (1 - ik * ik);
          rotVelHand = 3.8 * (1 - ik);
        } else {
          exSmooth = 0;
          rotVelHand = 0;
          introT = -1;
        }
      }

      // 树旋转（拖动惯性 + 自动慢转 + 手势 + 照片弹出快转）
      rot += (rotVel + AUTO + rotVelHand + photoSpinS) * dt;
      rotVel *= Math.exp(-3.0 * dt);
      treeGroup.rotation.y = rot;

      // 相机（阻尼跟随）
      var k = 1 - Math.pow(0.002, dt);
      camY += (camYT - camY) * k;
      dist += (distT - dist) * k;
      camera.position.set(0, camY, dist);
      camera.lookAt(0, CENTER_Y, 0);

      // 鼠标
      mAct += (mActT - mAct) * (1 - Math.pow(0.01, dt));
      uniforms.uMouseActive.value = mAct;
      updateMouse();

      // 点击爆发弹簧 + 手势散开叠加
      exV += (-9.0 * ex - 3.2 * exV) * dt;
      ex = Math.max(0, ex + exV * dt);
      uniforms.uExplode.value = Math.min(ex + exSmooth, 2.4);

      // 树顶星脉动与缓转
      star.scale.setScalar(5.5 + Math.sin(time * 2.4) * 0.4 + (ex + exSmooth) * 1.0);
      star.material.rotation = time * 0.25;

      // 落雪（手掌张开激活后持续不停）
      if (snowOn) {
        var sarr = snowGeo.attributes.position.array;
        for (var j = 0; j < SNOW_N; j++) {
          sarr[j * 3 + 1] -= svel[j] * dt;
          sarr[j * 3] += Math.sin(time * 0.5 + j) * 0.12 * dt;
          if (sarr[j * 3 + 1] < -1) sarr[j * 3 + 1] = 34;
        }
        snowGeo.attributes.position.needsUpdate = true;
      }

      // 星空缓慢自转
      stars.rotation.y = time * 0.008;

      // 散开粒子群：金球 + 橙金方块 + 红球 + 图片粒子，随散开程度展开成星云
      var exAll = Math.min(ex + exSmooth, 1.5);
      var spread = Math.max(0, (exAll - 0.1) / 1.2);
      imgUniforms.uImgFade.value = 0.06 + Math.min(0.94, spread * 2.0);   // 聚拢时以金粒子为主，散开时图片渐显
      if (spread < 0.02) {
        if (burstShown) {
          burstShown = false;
          for (var pz = 0; pz < burstItems.length; pz++) burstItems[pz].visible = false;
        }
      } else {
        burstShown = true;
        for (var pb = 0; pb < burstItems.length; pb++) {
          var bi = burstItems[pb];
          var ud = bi.userData;
          bi.visible = true;
          var kk = spread * (0.88 + 0.25 * Math.sin(time * 0.9 + ud.phase));
          bi.position.set(ud.dir.x * kk, 10.5 + ud.dir.y * kk * 0.85, ud.dir.z * kk);
          var sc = Math.min(1, spread * 1.7) * ud.size;
          bi.scale.setScalar(sc);
          if (ud.kind === 1) {
            bi.lookAt(camera.position);
            bi.rotateZ(ud.tilt + Math.sin(time * 0.5 + ud.phase) * 0.15);
          }
        }
      }

      // 照片弹出 / 缩回（弹簧动画，带弹出过冲）
      if (photoMesh) {
        photoV += (photoTarget - photoCur) * 75 * dt - photoV * 10 * dt;
        photoCur += photoV * dt;
        if (photoCur < 0.01) { photoCur = 0.01; photoV = 0; }
        photoMesh.scale.setScalar(photoCur);
        photoMesh.visible = photoCur > 0.03;
        // 从树心弹出，稳定在"相机正前方"（任何设备任何缩放都完整可见，绝不出屏）
        camera.getWorldDirection(photoCamDir);
        photoTgt.copy(camera.position).addScaledVector(photoCamDir, 9);
        photoTgt.y += 0.6;
        photoMesh.position.lerpVectors(photoTreeC, photoTgt, Math.min(1, photoCur));
        photoMesh.quaternion.copy(camera.quaternion);   // 完全平行于屏幕：零透视变形
      }

      // 帧率监测：持续低帧率自动关泛光，保证流畅
      frameCnt++;
      if (time - fpsT > 2) {
        if (frameCnt / (time - fpsT) < 42 && composer) composer = null;
        frameCnt = 0; fpsT = time;
      }

      if (composer) composer.render(); else renderer.render(scene, camera);
    }

    window.addEventListener('resize', function () {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, IS_MOBILE ? 1.5 : 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      uniforms.uPR.value = renderer.getPixelRatio();
      if (composer) composer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();

    window.__cyberTree = {
      ready: true,
      count: TOTAL,
      frames: function () { return frames; },
      points: function () { return renderer.info.render.points; }
    };
  }

  main();
  setLoad(30);
  startPrefetch();
})();
</script>

<script type="module">
// ============ 手势识别模块（MediaPipe Hands）============
import { FilesetResolver, HandLandmarker } from './vendor/vision_bundle.mjs';

const ctl = window.__gestureCtl;
const btn = document.getElementById('gestureBtn');
const hint = document.getElementById('hint');
const camBox = document.getElementById('camBox');
const video = document.getElementById('camVideo');
const ovCanvas = document.getElementById('camOverlay');
const octx = ovCanvas.getContext('2d');

const HAND_CONNECTIONS = [
  [0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],
  [9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]
];
const TIPS = [4, 8, 12, 16, 20];

let handLandmarker = null;
let lastVideoTime = -1;
let lastLms = [];
let running = false;
let pointStart = 0, photoShown = false, frameCanvas = null;
let baseHS = 0, hsSm = 0;   // 手掌入镜基准 + 平滑值（用于前后移动缩放）
let thumbPrevX = null, thumbPrevT = 0, thumbVel = 0;
let openSm = 0;

// 拍照闪光层
const flash = document.createElement('div');
flash.className = 'flash';
document.body.appendChild(flash);

const d3 = (a, b) => Math.hypot(a.x - b.x, a.y - b.y, (a.z || 0) - (b.z || 0));

// 单指伸展度 0（卷曲）~ 1（伸直）：指尖到指根的距离 / 两段指骨长度之和
// 指骨长度不随弯曲变化，因此不受手大小、离摄像头远近影响，判定最稳
function fingerExtend(lm, mcp, pip, tip) {
  // 3D 指节夹角判定：手前后移动/指向镜头造成投影缩短时不受影响
  const v1x = lm[pip].x - lm[mcp].x, v1y = lm[pip].y - lm[mcp].y, v1z = (lm[pip].z || 0) - (lm[mcp].z || 0);
  const v2x = lm[tip].x - lm[pip].x, v2y = lm[tip].y - lm[pip].y, v2z = (lm[tip].z || 0) - (lm[pip].z || 0);
  const dot = v1x * v2x + v1y * v2y + v1z * v2z;
  const m1 = Math.hypot(v1x, v1y, v1z), m2 = Math.hypot(v2x, v2y, v2z);
  if (m1 < 1e-6 || m2 < 1e-6) return 0;
  const cos = dot / (m1 * m2);
  let ext = Math.max(0, Math.min(1, (cos - 0.2) / 0.7));
  // 2D 否决权：纯投影里手指明显卷曲（握拳）的，无论 3D 怎么算都封顶——
  // 防止"握拳 + 前后移动"时深度估计误差造成误判伸直（误散开）
  const dTipMcp2 = Math.hypot(lm[tip].x - lm[mcp].x, lm[tip].y - lm[mcp].y);
  const full2 = Math.hypot(lm[pip].x - lm[mcp].x, lm[pip].y - lm[mcp].y)
              + Math.hypot(lm[tip].x - lm[pip].x, lm[tip].y - lm[pip].y);
  if (full2 > 1e-6 && dTipMcp2 / full2 < 0.80) ext = Math.min(ext, 0.1);
  return ext;
}

// 手掌张开度 0（握拳）~ 1（完全张开）：四指中位数（逐指平滑 + 抗单指误判）
// 拇指不参与聚散（握拳时它搭在四指外侧会被误判为伸直）；中位数可无视旋转拳头时的单指瞬时误判
let fingerSm = [0, 0, 0, 0];
const openHist = [];
function handOpenness(lm) {
  const raw = [
    fingerExtend(lm, 5, 6, 8),
    fingerExtend(lm, 9, 10, 12),
    fingerExtend(lm, 13, 14, 16),
    fingerExtend(lm, 17, 18, 20)
  ];
  for (let i = 0; i < 4; i++) {
    fingerSm[i] += (raw[i] - fingerSm[i]) * (raw[i] > fingerSm[i] ? 0.7 : 0.6);
  }
  const srt = fingerSm.slice().sort((a, b) => a - b);
  let med = (srt[1] + srt[2]) / 2;
  // 时间中值滤波（最近 5 帧取中位）：滤掉单帧识别跳变，消除"一闪一闪"，整体延迟仅 ~0.07 秒
  openHist.push(med);
  if (openHist.length > 7) openHist.shift();
  const hs = openHist.slice().sort((a, b) => a - b);
  med = hs[Math.floor(hs.length / 2)];
  return med < 0.15 ? 0 : med;   // 死区：保证完全聚拢、滤掉近距离抖动
}

// 生成空照片边框（金色渐变框 + 深色内底 + 星点装饰，暂不放图片内容）
function makeEmptyFrame() {
  const photoW = 1280, photoH = 960;
  const pad = 40, bottomBar = 180;
  const W = photoW + pad * 2;
  const H = photoH + pad + bottomBar + pad;
  const cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d');
  ctx.fillStyle = '#0a1422';
  ctx.fillRect(0, 0, W, H);
  const g0 = ctx.createLinearGradient(0, pad, 0, pad + photoH);
  g0.addColorStop(0, 'rgba(12, 24, 40, 1)');
  g0.addColorStop(1, 'rgba(6, 12, 22, 1)');
  ctx.fillStyle = g0;
  ctx.fillRect(pad, pad, photoW, photoH);
  for (let i = 0; i < 150; i++) {
    const x = pad + Math.random() * photoW, y = pad + Math.random() * photoH;
    const r = Math.random() * 1.8 + 0.4;
    const a = (Math.random() * 0.5 + 0.12).toFixed(2);
    ctx.fillStyle = 'rgba(190, 235, 255, ' + a + ')';
    ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.fill();
  }
  const g = ctx.createLinearGradient(0, 0, W, H);
  g.addColorStop(0, '#f7dc86'); g.addColorStop(0.5, '#c9a227'); g.addColorStop(1, '#f0cf6e');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, 22); ctx.fillRect(0, H - 22, W, 22);
  ctx.fillRect(0, 0, 22, H); ctx.fillRect(W - 22, 0, 22, H);
  ctx.strokeStyle = 'rgba(220, 190, 110, 0.75)';
  ctx.lineWidth = 2;
  ctx.strokeRect(pad + 1, pad + 1, photoW - 2, photoH - 2);
  ctx.strokeStyle = 'rgba(255, 230, 160, 0.9)';
  ctx.lineWidth = 3;
  const corner = (cx, cy, len) => {
    ctx.beginPath(); ctx.moveTo(cx - len, cy); ctx.lineTo(cx + len, cy); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx, cy - len); ctx.lineTo(cx, cy + len); ctx.stroke();
  };
  corner(52, 52, 10); corner(W - 52, 52, 10);
  corner(52, H - 52, 10); corner(W - 52, H - 52, 10);
  ctx.fillStyle = '#c9a227';
  ctx.font = '600 68px Georgia, "Times New Roman", serif';
  ctx.textAlign = 'center';
  ctx.fillText('MERRY CHRISTMAS', W / 2, H - 60);
  return cv;
}

// ========== 分享版：比耶拍照 + 随机翻看 ==========
const photoPool = [];       // 访客拍的照片
let shownIdx = [];          // 本轮已展示过的索引
let lastShot = 0;

// 比耶：食指 + 中指伸直，无名指 + 小指弯曲
function isPeace(lm) {
  return fingerExtend(lm, 5, 6, 8) > 0.65
      && fingerExtend(lm, 9, 10, 12) > 0.65
      && fingerExtend(lm, 13, 14, 16) < 0.4
      && fingerExtend(lm, 17, 18, 20) < 0.4;
}

// 拍照：摄像头帧 → 横版金框照片卡（原比例、高清、无裁切）
function makePhotoCard() {
  const vw = video.videoWidth || 1280, vh = video.videoHeight || 960;
  const photoW = 1280;
  const photoH = Math.round(photoW * vh / vw);
  const pad = 40, bottomBar = 180;
  const W = photoW + pad * 2;
  const H = photoH + pad + bottomBar + pad;
  const cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d');
  ctx.fillStyle = '#0a1422';
  ctx.fillRect(0, 0, W, H);
  ctx.save();
  ctx.translate(pad + photoW, pad);
  ctx.scale(-1, 1);
  try {
    ctx.drawImage(video, 0, 0, vw, vh, 0, 0, photoW, photoH);
  } catch (e) { /* 视频未就绪 */ }
  ctx.restore();
  const g = ctx.createLinearGradient(0, 0, W, H);
  g.addColorStop(0, '#f7dc86'); g.addColorStop(0.5, '#c9a227'); g.addColorStop(1, '#f0cf6e');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, 22); ctx.fillRect(0, H - 22, W, 22);
  ctx.fillRect(0, 0, 22, H); ctx.fillRect(W - 22, 0, 22, H);
  ctx.strokeStyle = 'rgba(220, 190, 110, 0.8)';
  ctx.lineWidth = 2;
  ctx.strokeRect(pad + 1, pad + 1, photoW - 2, photoH - 2);
  ctx.fillStyle = '#c9a227';
  ctx.font = '600 68px Georgia, "Times New Roman", serif';
  ctx.textAlign = 'center';
  ctx.fillText('MERRY CHRISTMAS', W / 2, H - 60);
  return cv;
}

function takePhoto() {
  const card = makePhotoCard();
  photoPool.push(card);
  shownIdx = [];                                     // 新照片加入 → 重开轮换
  if (typeof window.__cyberTreeUpdateAtlas === 'function') {
    window.__cyberTreeUpdateAtlas(photoPool.slice(-4));   // 最近 4 张铺进粒子云
  }
  // 保存到本机文件夹（仅本地服务器有效；线上部署静默跳过）
  try {
    fetch('/photo', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ data: card.toDataURL('image/png') })
    }).catch(() => {});
  } catch (e) {}
  flash.style.transition = 'none';
  flash.style.opacity = '0.8';
  requestAnimationFrame(() => {
    flash.style.transition = 'opacity .55s';
    flash.style.opacity = '0';
  });
}

// 调试接口（也可用于外部触发拍照）
window.__testTakePhoto = takePhoto;

// 取下一张展示照片：随机，一轮内不重复
function nextPhotoCard() {
  if (!photoPool.length) return null;
  if (shownIdx.length >= photoPool.length) shownIdx = [];
  const remaining = photoPool.map((_, i) => i).filter(i => shownIdx.indexOf(i) < 0);
  const pick = remaining[Math.floor(Math.random() * remaining.length)];
  shownIdx.push(pick);
  return photoPool[pick];
}

function showPhoto(on) {
  if (typeof window.__cyberTreePhoto !== 'function') return;
  if (on) {
    const card = nextPhotoCard();
    if (card) {
      window.__cyberTreePhoto(card, true);           // 展示访客拍的照片
    } else {
      if (!frameCanvas) frameCanvas = makeEmptyFrame();
      window.__cyberTreePhoto(frameCanvas, true);    // 还没拍过照 → 空框
    }
  } else {
    window.__cyberTreePhoto(null, false);
  }
}

async function initMediaPipe() {
  const vision = await FilesetResolver.forVisionTasks(window.__assetPaths.wasmDir);
  const make = (delegate) => HandLandmarker.createFromOptions(vision, {
    baseOptions: { modelAssetPath: window.__assetPaths.model, delegate },
    runningMode: 'VIDEO',
    numHands: 2
  });
  try { handLandmarker = await make('GPU'); }
  catch (e) { handLandmarker = await make('CPU'); }
}

function setPhotoState(on) {
  if (on === photoShown) return;
  photoShown = on;
  showPhoto(on);
}

function handleResult(res, now) {
  const hands = res.landmarks || [];
  if (hands.length > 0) {
    ctl.active = true;
    ctl.lastSeen = now;
    lastLms = hands;
    const dead = 0.18;

    if (hands.length >= 2) {
      // ---- 双手：开合缩放 + 用两手中点旋转 ----
      setPhotoState(false);
      ctl.photoSpin = 0;
      const lw = hands[0][0], rw = hands[1][0];
      const spread = Math.hypot(lw.x - rw.x, lw.y - rw.y);
      ctl.zoom = Math.max(0, Math.min(1, (spread - 0.16) / 0.5));
      ctl.explode = 0;              // 双手时保持树形
      ctl.camY = null;              // 双手时不做俯仰
      const midX = (hands[0][9].x + hands[1][9].x) / 2;
      let hx = (0.5 - midX) * 2;
      if (Math.abs(hx) < dead) hx = 0;
      else hx = (hx - Math.sign(hx) * dead) / (1 - dead);
      ctl.rotSpeed = hx * 3.0;
    } else {
      // ---- 单手：张开/握拳=聚散 · 拇指横移=旋转 · 食指点下=照片 · 张开=下雪 ----
      const lm = hands[0];
      ctl.zoom = null;

      // 手接近画面边缘（变大出画）时不响应：避免关键点外插导致误判
      let edgeSafe = true;
      for (const p of lm) {
        if (p.x < 0.03 || p.x > 0.97 || p.y < 0.03 || p.y > 0.97) { edgeSafe = false; break; }
      }
      if (!edgeSafe) return;

      const rawOpen = handOpenness(lm);
      // 迟滞平滑：张开方向跟手快、收拢方向慢——张开时识别抖动不会让树误聚拢
      openSm += (rawOpen - openSm) * 0.8;   // 输入已中值滤波，双向都快（跟手）
      const open = openSm;
      ctl.explode = open;             // 张开度 = 散开程度（手快慢决定聚散快慢）

      if (open > 0.6 && typeof window.__cyberTreeStartSnow === 'function') {
        window.__cyberTreeStartSnow();  // 张开手掌触发下雪，之后不停
      }

      ctl.camY = Math.max(2.5, Math.min(24, 11.5 + (0.55 - lm[9].y) * 18));

      // 手掌前后移动 → 缩放（以入镜时的手掌大小为基准，靠近镜头放大、远离缩小）
      const handSize = d3(lm[0], lm[9]);
      if (!baseHS) { baseHS = handSize; hsSm = handSize; }
      hsSm += (handSize - hsSm) * 0.4;           // 平滑手大小（滤抖但保持灵活）
      let dev = hsSm / baseHS - 1;
      if (Math.abs(dev) < 0.05) dev = 0;          // 死区：手停在原地时不缩放
      ctl.zoom = Math.max(0, Math.min(1, 0.5 + dev * 2.2));

      // 拇指横移 → 粒子旋转（移动速度决定转速）
      if (open > 0.3) {
        const tx = lm[4].x;
        if (thumbPrevX != null) {
          const dtt = Math.max((now - thumbPrevT) / 1000, 0.008);
          thumbVel += (((tx - thumbPrevX) / dtt) - thumbVel) * 0.35;
        }
        thumbPrevX = tx;
        thumbPrevT = now;
        if (Math.abs(thumbVel) < 0.12) ctl.rotSpeed = 0;   // 死区：轻微晃动不转
        else ctl.rotSpeed = Math.max(-4.5, Math.min(4.5, -thumbVel * 20));
      } else {
        thumbPrevX = null;
        thumbVel = 0;
        ctl.rotSpeed = 0;
      }

      // 食指点下（保持张开）→ 弹出照片 + 粒子快速旋转；食指抬起 → 照片缩回
      // 点图动作：其余三指伸直 + 食指弯下（不依赖方向，轻轻一点即可）
      const othersUp = fingerExtend(lm, 9, 10, 12) > 0.45
                    && fingerExtend(lm, 13, 14, 16) > 0.45
                    && fingerExtend(lm, 17, 18, 20) > 0.45;
      const idxDown = othersUp && fingerExtend(lm, 5, 6, 8) < 0.78;
      if (idxDown) {
        if (!pointStart) pointStart = now;
        else if (now - pointStart > 100) setPhotoState(true);
      } else {
        pointStart = 0;
        setPhotoState(false);
      }
      // 比耶 → 立刻拍照（2.5 秒冷却防连拍）
      if (isPeace(lm) && now - lastShot > 2500) {
        takePhoto();
        lastShot = now;
      }
      ctl.photoSpin = photoShown ? 2.6 : 0;
    }
  } else {
    lastLms = [];
    setPhotoState(false);
    ctl.photoSpin = 0;
    if (now - (ctl.lastSeen || 0) > 500) {
      ctl.active = false;
      baseHS = 0;   // 手离开后重置缩放基准
    }
  }
}

function drawOverlay() {
  const w = ovCanvas.width, h = ovCanvas.height;
  octx.clearRect(0, 0, w, h);
  if (!lastLms.length || !video.videoWidth) return;

  // 视频 → 画布的 cover 映射（与 CSS 一致）
  const vw = video.videoWidth, vh = video.videoHeight;
  const scale = Math.max(w / vw, h / vh);
  const dw = vw * scale, dh = vh * scale;
  const dx = (w - dw) / 2, dy = (h - dh) / 2;
  const P = (p) => ({ x: dx + (1 - p.x) * dw, y: dy + p.y * dh });

  for (const lm of lastLms) {
    // 手部轮廓（手腕→拇指→四指尖→小指根）
    const oi = [0, 1, 2, 3, 4, 8, 12, 16, 20, 19, 18, 17];
    const pts = oi.map(i => P(lm[i]));
    let cx = 0, cy = 0;
    pts.forEach(p => { cx += p.x; cy += p.y; });
    cx /= pts.length; cy /= pts.length;
    const exp = pts.map(p => ({ x: cx + (p.x - cx) * 1.3, y: cy + (p.y - cy) * 1.3 }));

    // 1) 只在手部区域显示摄像头画面（脸部不会出现）
    octx.save();
    octx.beginPath();
    exp.forEach((p, k) => k ? octx.lineTo(p.x, p.y) : octx.moveTo(p.x, p.y));
    octx.closePath();
    octx.clip();
    octx.save();
    octx.translate(w, 0);
    octx.scale(-1, 1);
    octx.drawImage(video, dx, dy, dw, dh);
    octx.restore();
    octx.restore();

    // 2) 手部发光轮廓（赛博描边）
    octx.save();
    octx.beginPath();
    exp.forEach((p, k) => k ? octx.lineTo(p.x, p.y) : octx.moveTo(p.x, p.y));
    octx.closePath();
    octx.strokeStyle = 'rgba(255,214,130,0.95)';
    octx.lineWidth = 2.5;
    octx.shadowColor = 'rgba(247,220,134,0.9)';
    octx.shadowBlur = 12;
    octx.stroke();
    octx.restore();

    // 3) 骨骼线 + 关节点
    octx.strokeStyle = 'rgba(255,214,130,0.7)';
    octx.lineWidth = 1.6;
    for (const [a, b] of HAND_CONNECTIONS) {
      const pa = P(lm[a]), pb = P(lm[b]);
      octx.beginPath(); octx.moveTo(pa.x, pa.y); octx.lineTo(pb.x, pb.y); octx.stroke();
    }
    octx.fillStyle = 'rgba(120,255,220,0.95)';
    for (const p of lm) {
      const q = P(p);
      octx.beginPath(); octx.arc(q.x, q.y, 2.5, 0, 6.2832); octx.fill();
    }
  }

  // 实时张开度
  if (ctl.active) {
    octx.fillStyle = 'rgba(140, 240, 220, 0.95)';
    octx.font = '11px monospace';
    octx.textAlign = 'left';
    let tag = '张开';
    if (ctl.explode < 0.2) tag = '握拳';
    else if (ctl.explode < 0.6) tag = '半开';
    octx.fillText('张开度 ' + (ctl.explode || 0).toFixed(2) + ' ' + tag, 8, h - 8);
  }
}

function loopDetect() {
  if (!running) return;
  if (handLandmarker && video.readyState >= 2) {
    const now = performance.now();
    if (video.currentTime !== lastVideoTime) {
      lastVideoTime = video.currentTime;
      try {
        const res = handLandmarker.detectForVideo(video, now);
        handleResult(res, now);
      } catch (e) { /* 单帧识别失败不中断 */ }
    }
  }
  drawOverlay();
  requestAnimationFrame(loopDetect);
}

btn.addEventListener('click', async () => {
  // 开场特效：整棵树炸开旋转再聚拢（正好覆盖摄像头启动的等待）
  if (window.__introBurst) window.__introBurst();
  flash.style.transition = 'none';
  flash.style.opacity = '0.65';
  requestAnimationFrame(() => {
    flash.style.transition = 'opacity .9s';
    flash.style.opacity = '0';
  });
  btn.disabled = true;
  btn.textContent = '正在开启摄像头…';
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user' }, audio: false
    });
    video.srcObject = stream;
    await video.play();

    if (!handLandmarker) {
      btn.textContent = '正在加载识别模型…';
      await initMediaPipe();
    }

    camBox.style.display = 'block';
    btn.style.display = 'none';
    hint.textContent = '张开手掌=散开下雪　握拳=聚拢　前后移动=缩放　食指弯下=翻看照片　比耶 1 秒=拍照';
    running = true;
    loopDetect();
  } catch (e) {
    console.error(e);
    const name = (e && e.name) || '未知错误';
    const tips = {
      NotAllowedError: '摄像头权限被拒绝——请点浏览器地址栏左边的图标，把「摄像头」改为允许；或去 系统设置→隐私与安全性→摄像头 打开浏览器开关，然后刷新页面',
      NotFoundError: '没有检测到摄像头设备',
      NotReadableError: '摄像头被其他程序占用——请先关闭正在使用摄像头的程序（视频会议、相机等），再刷新重试',
      OverconstrainedError: '摄像头不满足参数要求，请刷新重试',
      SecurityError: '当前地址不被允许使用摄像头（请确认地址是 localhost 开头）'
    };
    btn.textContent = '摄像头不可用（' + name + '）';
    hint.textContent = tips[name] || ('摄像头打开失败：' + name + '，请刷新重试');
    btn.disabled = false;
  }
});
</script>
